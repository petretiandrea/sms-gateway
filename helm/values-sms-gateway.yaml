app-template:
  controllers:
    main:
      forceRename: sms-gateway-service-v2
      type: deployment
      replicas: 1
      strategy: RollingUpdate
      rollingUpdate:
        surge: 1
        unavailable: "0"
      containers:
        main:
          image:
            repository: petretiandrea/sms-gateway-service-v2
            tag: 3.0.4
            pullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            ENV_MONGO__CONNECTION__STRING:
              valueFrom:
                secretKeyRef:
                  name: sms-gateway
                  key: MONGO_CONNECTION_STRING
            ENV_MONGO__DATABASE__NAME:
              valueFrom:
                secretKeyRef:
                  name: sms-gateway
                  key: MONGO_DATABASE_NAME
          envFrom:
            - configMapRef:
                identifier: app-config
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
                initialDelaySeconds: 10
                failureThreshold: 10
                periodSeconds: 30
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
                initialDelaySeconds: 10
                failureThreshold: 10
                periodSeconds: 30

  configMaps:
    app-config:
      forceRename: sms-gateway-service-v2
      labels:
        app: sms-gateway-api-v2
      data:
        ENV_FIREBASE_CREDENTIALS__FILE: /be-aesthetic-admin-sdk.json
        ENV_DRY__RUN: "false"
        OTEL_EXPORTER_OTLP_ENDPOINT: "http://opentelemetry-collector.monitoring.svc.cluster.local:4317"
        OTEL_EXPORTER_OTLP_INSECURE: "true"
        OTEL_EXPORTER_OTLP_COMPRESSION: "gzip"

  persistence:
    firebase-admin-config:
      type: secret
      name: firebase-admin-config
      advancedMounts:
        main:
          main:
            - path: /be-aesthetic-admin-sdk.json
              subPath: firebase-admin.json
              readOnly: true

  service:
    main:
      forceRename: sms-gateway-service-v2
      controller: main
      type: ClusterIP
      ports:
        http:
          port: 8080
          targetPort: 8080
          protocol: TCP

  ingress:
    main:
      forceRename: sms-gateway-ingress-v2
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: https-certificate
        nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        nginx.ingress.kubernetes.io/rewrite-target: /$1
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        nginx.ingress.kubernetes.io/use-regex: "true"
      hosts:
        - host: agenda.beaesthetic.it
          paths:
            - path: /sms-gateway/v2/(.*)
              pathType: ImplementationSpecific
              service:
                identifier: main
                port: http
      tls:
        - hosts:
            - agenda.beaesthetic.it
          secretName: https-certificate
