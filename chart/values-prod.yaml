common:
  config:
    env:
      LOG_LEVEL: INFO

  secrets:
    existingSecrets:
      - sms-gateway-connection-secrets

    # Alternative to existingSecrets: map each runtime env var from a specific
    # key in an existing Secret.
    # envFromKeys:
    #   POSTGRES_DSN:
    #     secretName: postgres-app
    #     key: dsn
    #   RABBITMQ_DSN:
    #     secretName: rabbitmq-app
    #     key: dsn

migration:
  enabled: true

api:
  replicaCount: 2
  image:
    repository: ghcr.io/example/sms-gateway-api
    tag: "1.0.0"

outbox:
  replicaCount: 1
  image:
    repository: ghcr.io/example/sms-gateway-outbox
    tag: "1.0.0"
  env:
    OUTBOX_BATCH_SIZE: "100"
    OUTBOX_POLLING_INTERVAL: "5s"
