{{- if .Values.outbox.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sms-gateway.outboxConfigName" . }}
  labels:
    {{- include "sms-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: "outbox"
data:
  outbox.yaml: |-
    source:
      type: postgres
      data:
        dsn: ${POSTGRES_DSN}
        table_name: outbox_messages
        batch_size: 100
        poll_interval: 1s
        initialize_schema: true

    channels:
      - name: sms.send.internal
        publisher:
          type: rabbitmq
          data:
            url: ${RABBITMQ_DSN}
            exchange: sms
            routing_key: sms.send.internal.requested
            content_type: application/json
{{- end }}
