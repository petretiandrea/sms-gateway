{{- if .Values.common.config.env }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sms-gateway.configMapName" . }}
  labels:
    {{- include "sms-gateway.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.common.config.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
