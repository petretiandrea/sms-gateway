name: Build

on:
  pull_request:
    branches:
      - main
      - next

permissions:
  contents: read

jobs:
  application:
    name: Application build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build
      - run: docker build --tag sms-gateway:ci .

  chart:
    name: Chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint chart
